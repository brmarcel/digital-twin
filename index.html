<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blumentopf – Digitaler Zwilling</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1e232b;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    #info {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 2;
      background: rgba(17,21,27,.86);
      padding: 16px;
      border-radius: 12px;
      width: min(300px, calc(100vw - 64px));
    }
    h1 { font-size: 18px; margin: 0 0 12px; }
    #moisture { font-size: 30px; font-weight: 700; margin: 8px 0; }
    #status { font-size: 13px; color: #f3bd71; margin-bottom: 10px; }
    #hint, #modelhint { font-size: 12px; color: #aaa; margin-top: 8px; }
    label { display: block; font-size: 12px; margin: 9px 0 3px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #4c5562;
      border-radius: 5px;
      background: #282f3a;
      color: white;
    }
    button {
      margin-top: 10px;
      background: #64c99b;
      border: 0;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    #disconnect { background: #b9c2cf; }
    #login[hidden], #disconnect[hidden] { display: none; }
  </style>
</head>
<body>
  <section id="info">
    <h1>Digitaler Blumentopf</h1>
    <div>Bodenfeuchtigkeit</div>
    <div id="moisture">– %</div>
    <div id="status" role="status">Nicht verbunden</div>
    <form id="login">
      <label for="host">EMQX-Host (ohne https://)</label>
      <input id="host" placeholder="dein-cluster.emqxsl.com" required>
      <label for="username">MQTT-Benutzer (nur Leserechte)</label>
      <input id="username" autocomplete="username" required>
      <label for="password">MQTT-Passwort</label>
      <input id="password" type="password" autocomplete="off" required>
      <button type="submit">Verbinden</button>
    </form>
    <button id="disconnect" hidden>Trennen</button>
    <div id="hint">Maus ziehen = drehen · Mausrad = zoomen</div>
    <div id="modelhint">3D-Modell: <code>Blumen Topf Grund (~recovered).3mf</code></div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mqtt": "https://esm.sh/mqtt@5.10.1?bundle"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';
    import mqtt from 'mqtt';

    const MODEL_URL = './plant-pot-model.3mf';

    // Szene, Kamera, Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e232b);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(7.2, 4.8, 7.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Licht
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    const lightMain = new THREE.DirectionalLight(0xffffff, 1.4);
    lightMain.position.set(6, 10, 5);
    lightMain.castShadow = true;
    lightMain.shadow.mapSize.set(1024, 1024);
    scene.add(lightMain);

    const lightFill = new THREE.DirectionalLight(0xffffff, 0.35);
    lightFill.position.set(-6, 5, -4);
    scene.add(lightFill);

    // Boden / Tisch
    const table = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 18),
      new THREE.MeshStandardMaterial({ color: 0xd9dbde, roughness: 0.94 })
    );
    table.rotation.x = -Math.PI / 2;
    table.position.y = -1.52;
    table.receiveShadow = true;
    scene.add(table);

    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xb9bec6 });
    const lineGeometry1 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-8, -1.519, 0.8),
      new THREE.Vector3(8, -1.519, 0.8)
    ]);
    scene.add(new THREE.Line(lineGeometry1, lineMaterial));

    const lineGeometry2 = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-1.2, -1.519, -8),
      new THREE.Vector3(-1.2, -1.519, 8)
    ]);
    scene.add(new THREE.Line(lineGeometry2, lineMaterial));

    // Materialien
    const outerPotMaterial = new THREE.MeshStandardMaterial({ color: 0x181a1d, roughness: 0.76, metalness: 0.04 });
    const yellowMaterial = new THREE.MeshStandardMaterial({ color: 0xf3e21f, roughness: 0.46, metalness: 0.02 });
    const soilMaterial = new THREE.MeshStandardMaterial({ color: 0xa17b51, roughness: 1.0 });
    const stemMaterial = new THREE.MeshStandardMaterial({ color: 0xa8d66f, roughness: 0.82 });
    const leafMaterial = new THREE.MeshStandardMaterial({ color: 0x72c84b, roughness: 0.92 });
    const stickMaterial = new THREE.MeshStandardMaterial({ color: 0xd6c9a4, roughness: 0.96 });

    const potAssembly = new THREE.Group();
    scene.add(potAssembly);

    function createLeaf(scale = 1) {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 14), leafMaterial);
      leaf.scale.set(1.65 * scale, 0.42 * scale, 0.95 * scale);
      leaf.castShadow = true;
      return leaf;
    }

    function createPlant() {
      const plant = new THREE.Group();

      const stems = [
        { base: [0.00, 0.00, 0.00], tip: [-1.28, 2.38, 0.26], rot: [0.24, 0.10, 0.30], leaves: 4 },
        { base: [0.18, 0.00, -0.10], tip: [1.34, 1.94, -0.16], rot: [-0.18, 0.20, -0.74], leaves: 4 },
        { base: [-0.08, 0.00, 0.06], tip: [0.12, 2.80, -0.08], rot: [0.02, 0.00, 0.08], leaves: 5 },
        { base: [-0.24, 0.00, 0.20], tip: [-0.58, 2.18, 0.96], rot: [0.70, -0.18, 0.16], leaves: 4 },
        { base: [0.24, 0.00, 0.18], tip: [1.02, 2.14, 0.92], rot: [0.56, 0.12, -0.38], leaves: 4 },
        { base: [-0.26, 0.00, -0.16], tip: [-0.92, 1.72, -0.88], rot: [-0.34, 0.30, 0.58], leaves: 4 },
        { base: [0.22, 0.00, -0.04], tip: [0.58, 2.46, -1.02], rot: [0.12, -0.34, -0.14], leaves: 4 },
        { base: [0.06, 0.00, 0.20], tip: [1.14, 1.68, 0.62], rot: [0.28, 0.60, -0.56], leaves: 3 },
        { base: [-0.14, 0.00, -0.06], tip: [-1.02, 1.58, -0.34], rot: [-0.28, -0.18, 0.72], leaves: 3 }
      ];

      stems.forEach((cfg, stemIndex) => {
        const start = new THREE.Vector3(...cfg.base);
        const end = new THREE.Vector3(...cfg.tip);
        const direction = new THREE.Vector3().subVectors(end, start);
        const length = direction.length();

        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.03, 0.025, length, 10),
          stemMaterial
        );
        stem.position.copy(start).addScaledVector(direction, 0.5);
        stem.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
        stem.castShadow = true;
        plant.add(stem);

        for (let i = 0; i < cfg.leaves; i++) {
          const t = (i + 1) / (cfg.leaves + 1);
          const leaf = createLeaf(0.92 + ((i + stemIndex) % 3) * 0.12);
          leaf.position.copy(start).lerp(end, t);
          leaf.position.x += (i % 2 === 0 ? 0.16 : -0.14);
          leaf.position.y += 0.12 + i * 0.12;
          leaf.position.z += (i % 2 === 0 ? -0.05 : 0.06);
          leaf.rotation.set(cfg.rot[0], cfg.rot[1] + stemIndex * 0.13 + i * 0.18, cfg.rot[2] + (i % 2 === 0 ? 0.7 : -0.7));
          plant.add(leaf);
        }
      });

      const sticks = [
        { x: -0.10, z: 0.12, h: 2.70 },
        { x: 0.24, z: -0.02, h: 2.48 },
        { x: 0.02, z: -0.26, h: 2.28 },
        { x: -0.28, z: 0.02, h: 2.05 }
      ];

      sticks.forEach(({ x, z, h }) => {
        const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, h, 8), stickMaterial);
        stick.position.set(x, h / 2, z);
        stick.rotation.z = x * 0.18;
        stick.castShadow = true;
        plant.add(stick);
      });

      return plant;
    }

    function addInnerContents(parent) {
      const contents = new THREE.Group();
      parent.add(contents);

      // Position des gelben Einsatzes innerhalb des 3D-Modells
      const insertCenterX = 0.0;
      const insertCenterZ = 0.28;
      const insertBottomY = 1.48;
      const insertHeight = 1.68;
      const insertTopY = insertBottomY + insertHeight;

      const yellowPot = new THREE.Mesh(
        new THREE.CylinderGeometry(1.46, 1.30, insertHeight, 64, 1, true),
        yellowMaterial
      );
      yellowPot.position.set(insertCenterX, insertBottomY + insertHeight / 2, insertCenterZ);
      yellowPot.castShadow = true;
      yellowPot.receiveShadow = true;
      contents.add(yellowPot);

      const yellowBottom = new THREE.Mesh(
        new THREE.CylinderGeometry(1.30, 1.30, 0.08, 48),
        yellowMaterial
      );
      yellowBottom.position.set(insertCenterX, insertBottomY + 0.04, insertCenterZ);
      yellowBottom.castShadow = true;
      yellowBottom.receiveShadow = true;
      contents.add(yellowBottom);

      // Erde vollständig im gelben Topf, fast bis zum Rand gefüllt
      const soilHeight = insertHeight - 0.14;
      const soil = new THREE.Mesh(
        new THREE.CylinderGeometry(1.20, 1.18, soilHeight, 48),
        soilMaterial
      );
      soil.position.set(insertCenterX, insertBottomY + soilHeight / 2 + 0.03, insertCenterZ);
      soil.castShadow = true;
      soil.receiveShadow = true;
      contents.add(soil);

      const soilSurface = new THREE.Mesh(
        new THREE.CircleGeometry(1.20, 48),
        new THREE.MeshStandardMaterial({ color: 0x9a7650, roughness: 1.0 })
      );
      soilSurface.rotation.x = -Math.PI / 2;
      soilSurface.position.set(insertCenterX, insertTopY - 0.10, insertCenterZ);
      soilSurface.receiveShadow = true;
      contents.add(soilSurface);

      const plant = createPlant();
      plant.position.set(insertCenterX, insertTopY - 0.10, insertCenterZ);
      contents.add(plant);

      return { soil };
    }

    async function loadOuterPot() {
      const loader = new ThreeMFLoader();

      return new Promise((resolve, reject) => {
        loader.load(
          MODEL_URL,
          (object) => {
            const holder = new THREE.Group();
            holder.add(object);

            object.rotation.x = -Math.PI / 2;
            object.rotation.y = Math.PI;
            object.updateMatrixWorld(true);

            object.traverse((child) => {
              if (child.isMesh) {
                child.material = outerPotMaterial;
                child.castShadow = true;
                child.receiveShadow = true;
                child.geometry.computeVertexNormals();
              }
            });

            let box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.x -= center.x;
            object.position.z -= center.z;
            object.position.y -= box.min.y;
            object.updateMatrixWorld(true);

            box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const targetHeight = 3.38;
            const scale = targetHeight / size.y;
            holder.scale.setScalar(scale);
            holder.position.set(0, -1.52, 0);

            resolve(holder);
          },
          undefined,
          (error) => reject(error)
        );
      });
    }

    let erde = null;

    try {
      const outerPot = await loadOuterPot();
      potAssembly.add(outerPot);
      const contentResult = addInnerContents(outerPot);
      erde = contentResult.soil;
    } catch (error) {
      console.error('3MF-Modell konnte nicht geladen werden:', error);

      // Fallback, damit die Seite trotzdem funktioniert
      const fallback = new THREE.Mesh(
        new THREE.CylinderGeometry(2.0, 1.8, 3.2, 64),
        outerPotMaterial
      );
      fallback.position.set(0, 0.08, 0);
      fallback.castShadow = true;
      fallback.receiveShadow = true;
      potAssembly.add(fallback);

      const contentGroup = new THREE.Group();
      contentGroup.position.set(0, -1.52, 0);
      potAssembly.add(contentGroup);
      const contentResult = addInnerContents(contentGroup);
      erde = contentResult.soil;
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.5, 0.15);
    controls.minDistance = 4.0;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.49;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ---- Bodenfeuchtigkeit visualisieren ----
    const trocken = new THREE.Color(0xa17b51);
    const feucht = new THREE.Color(0x24180f);
    const moistureText = document.getElementById('moisture');
    const statusText = document.getElementById('status');
    const login = document.getElementById('login');
    const disconnectButton = document.getElementById('disconnect');
    let client = null;

    function updateMoisture(value) {
      if (typeof value !== 'number' || !Number.isFinite(value) || !erde) return;
      const moisture = THREE.MathUtils.clamp(value, 0, 100);
      moistureText.textContent = `${Math.round(moisture)} %`;
      erde.material.color.copy(trocken).lerp(feucht, moisture / 100);
    }

    login.addEventListener('submit', (event) => {
      event.preventDefault();
      if (client) client.end(true);

      const host = document.getElementById('host').value.trim();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (!/^[a-zA-Z0-9.-]+$/.test(host)) {
        statusText.textContent = 'Ungültiger Hostname';
        return;
      }

      statusText.textContent = 'Verbinde …';
      const connection = mqtt.connect(`wss://${host}:8084/mqtt`, {
        username,
        password,
        clientId: `plant-twin-${crypto.randomUUID()}`,
        reconnectPeriod: 3000,
        connectTimeout: 10000
      });
      client = connection;

      connection.on('connect', () => {
        if (client !== connection) return;
        statusText.textContent = '● MQTT verbunden – warte auf Messwerte';
        login.hidden = true;
        disconnectButton.hidden = false;
        connection.subscribe('plantpot/01/moisture', { qos: 0 }, (error) => {
          if (error) statusText.textContent = `Abo fehlgeschlagen: ${error.message}`;
        });
      });

      connection.on('message', (topic, message) => {
        if (client !== connection || topic !== 'plantpot/01/moisture') return;
        try {
          const data = JSON.parse(message.toString());
          if (typeof data.moisture !== 'number' || !Number.isFinite(data.moisture)) return;
          updateMoisture(data.moisture);
          statusText.textContent = `● MQTT verbunden · letzter Empfang ${new Date().toLocaleTimeString('de-DE')}`;
        } catch (error) {
          console.warn('Ungültige MQTT-Nachricht:', error);
        }
      });

      connection.on('reconnect', () => {
        if (client === connection) statusText.textContent = 'Verbindung wird wiederhergestellt …';
      });

      connection.on('offline', () => {
        if (client === connection) statusText.textContent = 'Offline – erneuter Versuch …';
      });

      connection.on('error', (error) => {
        if (client === connection) statusText.textContent = `MQTT-Fehler: ${error.message}`;
        console.error('MQTT:', error);
      });
    });

    disconnectButton.addEventListener('click', () => {
      if (client) client.end(true);
      client = null;
      login.hidden = false;
      disconnectButton.hidden = true;
      document.getElementById('password').value = '';
      statusText.textContent = 'Nicht verbunden';
    });
  </script>
</body>
</html>
