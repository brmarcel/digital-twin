<!DOCTYPE html>
<!--
  index.html
  Definiert die Benutzeroberfläche des digitalen Zwillings: Dashboard,
  MQTT-Anmeldung und Statusanzeigen. Darstellung und Logik liegen in CSS/JS.
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digitaler Zwilling – Blumentopf</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Verwendete Bibliotheken als ES-Module bereitstellen. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mqtt": "https://esm.sh/mqtt@5.10.1?bundle"
    }
  }
  </script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <!-- Das Dashboard liegt über dem von Three.js erzeugten Canvas. -->
  <aside class="dashboard" aria-label="Dashboard">
    <div class="dashboard-header">
      <h1>Digitaler Blumentopf</h1>
      <span id="connection-indicator" class="indicator" aria-hidden="true"></span>
    </div>
    <div class="measurement-label">Bodenfeuchtigkeit</div>
    <div id="moisture" class="measurement" aria-live="polite">– %</div>
    <div id="connection-status" class="status" role="status">Nicht verbunden</div>

    <!-- Anmeldedaten werden nur zur Verbindung verwendet, nicht in HTML gespeichert. -->
    <details id="connection-panel" class="connection-panel">
      <summary>MQTT-Verbindung</summary>
      <form id="login" class="login-form">
        <label for="host">EMQX-Host</label>
        <input id="host" placeholder="cluster.emqxsl.com" autocomplete="url" required>
        <label for="username">Benutzername (nur Leserechte)</label>
        <input id="username" autocomplete="username" required>
        <label for="password">Passwort</label>
        <input id="password" type="password" autocomplete="off" required>
        <button type="submit">Verbinden</button>
      </form>
      <button id="disconnect" type="button" class="secondary" hidden>Verbindung trennen</button>
    </details>
    <div id="model-status" class="model-status">Lade 3D-Modell …</div>
    <p class="hint">Maus ziehen: drehen · Mausrad: zoomen</p>
  </aside>
</body>
</html>
